<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Medical Reports | Sumohan Care</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="/assets/css/aura-portal.css" rel="stylesheet">
  <link href="/assets/css/patient-shell.css?v=20261105-portal" rel="stylesheet">
  <link href="/assets/css/patient-dashboard.css?v=20261105-portal" rel="stylesheet">
  <link href="/assets/css/patient-portal-pages.css?v=20261105-slot-scroll" rel="stylesheet">
  <link rel="icon" type="image/png" href="/assets/images/sumohan-care-logo.png">
</head>
<body class="patient-dashboard patient-portal-page" data-patient-page="reports">
  <div class="patient-app"><div id="patient-sidebar-slot"></div><div class="patient-app__main"><div id="patient-navbar-slot"></div>
    <main class="patient-page patient-inner-page">
      <section class="patient-page-header patient-card"><div><p class="patient-eyebrow" id="patient-page-status" role="status">Loading your documents…</p><h1>Medical Reports</h1><p>Keep reports and prescriptions together for your next consultation.</p></div><a class="patient-secondary-button" href="/patient/appointments.html">View Visits</a></section>
      <section class="patient-card patient-form-card" aria-labelledby="upload-heading"><div class="patient-section__heading"><div><p class="patient-eyebrow">Add a record</p><h2 id="upload-heading">Upload a Document</h2></div></div><form id="document-upload-form" enctype="multipart/form-data"><label>Document type<select class="aura-field" name="documentType"><option value="REPORT">Report</option><option value="OLD_PRESCRIPTION">Previous Prescription</option></select></label><label>Title<input class="aura-field" name="name" placeholder="Document title" required></label><label>Document date<input class="aura-field" name="documentDate" type="date"></label><label>File<input class="aura-field" name="file" type="file" accept="application/pdf,image/jpeg,image/png,image/webp,text/plain" required></label><button class="patient-button" type="submit"><span class="material-symbols-outlined" aria-hidden="true">upload_file</span>Upload</button></form><p class="patient-form-message" id="document-upload-message" role="status"></p></section>
      <section class="patient-card patient-list-card" aria-label="Your medical documents"><div class="patient-tabs" role="tablist" aria-label="Document views"><button type="button" role="tab" data-document-tab="reports" aria-selected="true">Uploaded Reports</button><button type="button" role="tab" data-document-tab="prescriptions" aria-selected="false">Prescriptions</button></div><div class="patient-list-content" id="patient-page-content" role="tabpanel" aria-live="polite"></div></section>
      <footer class="patient-footer">Developed by <a href="https://ekathvainnovations.com/" target="_blank" rel="noopener noreferrer">Ekathva Innovations</a></footer>
    </main>
  </div></div>
  <div id="patient-mobile-nav-slot"></div>
  <script src="/assets/js/patient-shell.js?v=20261106-razorpay"></script>
  <script src="/assets/js/patient-simple-page.js?v=20261106-calendar"></script>
</body>
</html>
