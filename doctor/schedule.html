<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Appointments | Sumohan Care</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="/assets/css/aura-portal.css" rel="stylesheet">
</head>
<body>
  <div class="aura-shell">
    <aside class="aura-sidebar"></aside>
    <main class="aura-main">
      <section class="aura-page">
        <p class="aura-eyebrow" id="appointments-status">Loading appointments...</p>
        <div class="flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
          <div>
            <h1 class="aura-title">Appointments</h1>
            <p class="aura-subtitle">Review patient appointments. Slot availability is managed separately under Slot Management.</p>
          </div>
          <input id="appointments-date" class="aura-field max-w-56 p-3" type="date">
        </div>

        <div class="mt-8 flex flex-wrap gap-3" role="tablist" aria-label="Appointment views">
          <button class="aura-tab" type="button" data-appointment-tab="today" aria-selected="true">Today&apos;s Appointments</button>
          <button class="aura-tab" type="button" data-appointment-tab="future" aria-selected="false">Future Appointments</button>
          <button class="aura-tab" type="button" data-appointment-tab="past" aria-selected="false">Past Appointments</button>
        </div>

        <section class="aura-card aura-card--padded mt-5">
          <div class="grid gap-4" id="appointments-list"></div>
        </section>
      </section>
    </main>
  </div>

  <nav class="aura-mobile-nav"></nav>
  <script src="/assets/js/aura-core.js?v=2026070816"></script>
  <script src="/assets/js/doctor-portal.js?v=202607162"></script>
  <script src="/assets/js/doctor-appointments.js?v=2026070816"></script>
  <script src="/assets/js/aura-sidebar.js?v=2026070816"></script>
</body>
</html>
