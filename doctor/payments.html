<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payments &amp; Transactions | Sumohan Care</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="/assets/css/aura-portal.css?v=20261024" rel="stylesheet"><link href="/assets/css/brand.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="/assets/images/sumohan-care-logo.png">
</head>
<body>
  <div class="aura-shell"><aside class="aura-sidebar"></aside><main class="aura-main"><section class="aura-page">
    <p class="aura-eyebrow" id="doctor-payments-status" role="status">Loading payments…</p>
    <h1 class="aura-title">Payments &amp; Transactions</h1>
    <p class="aura-subtitle">Payment history for consultations booked with you. Dates are shown in India Standard Time.</p>
    <form id="doctor-payments-filters" class="aura-card aura-card--padded mt-6 flex flex-wrap items-end gap-4">
      <label class="grid gap-2 text-sm font-bold">Appointment date from<input class="aura-field p-3" type="date" name="start"></label>
      <label class="grid gap-2 text-sm font-bold">Appointment date to<input class="aura-field p-3" type="date" name="end"></label>
      <label class="grid gap-2 text-sm font-bold">Payment status<select class="aura-field p-3" name="status"><option value="">All statuses</option><option value="PAID">Paid</option><option value="PENDING">Pending</option><option value="FAILED">Failed</option><option value="REFUNDED">Refunded</option><option value="NOT_COLLECTED">Not collected</option></select></label>
      <button class="aura-button" type="submit">Apply filters</button><button class="aura-button aura-button--secondary" type="reset">Clear</button>
    </form>
    <div id="doctor-payments-summary" class="mt-5 grid gap-4" aria-live="polite"></div>
    <section class="aura-card aura-card--padded mt-5" aria-labelledby="transactions-heading">
      <h2 class="text-xl font-extrabold" id="transactions-heading">Consultation payment history</h2>
      <p class="mt-2 text-sm text-[#5a4044]">Demo entries are labelled and do not confirm money was collected. Bookings without a payment record show “Not collected”.</p>
      <div id="doctor-payments-list" class="mt-5 grid gap-4" aria-live="polite"></div>
      <div class="mt-6 flex flex-wrap items-center justify-between gap-3"><p id="doctor-payments-page" class="text-sm"></p><div class="flex gap-2"><button class="aura-button aura-button--secondary" id="payments-prev" type="button" disabled>Previous</button><button class="aura-button aura-button--secondary" id="payments-next" type="button" disabled>Next</button></div></div>
    </section>
  </section></main></div><nav class="aura-mobile-nav"></nav>
  <script src="/assets/js/aura-core.js?v=2026070816"></script><script src="/assets/js/doctor-portal.js?v=202607162"></script>
  <script src="/assets/js/doctor-payments.js?v=20261106-razorpay"></script><script src="/assets/js/aura-sidebar.js?v=20261106-razorpay"></script>
</body>
</html>
